<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4efe6;
      color: #2c241b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    main {
      width: 100%;
      max-width: 480px;
      background: #fffdf8;
      border: 1px solid #e4d8c4;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 12px 32px rgba(74, 52, 28, 0.08);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 28px;
    }

    ol {
      padding-left: 1.4em;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    li {
      font-size: 1.125rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Генератор идей для постов</h1>
    <ol>
      <li>5 идей постов для экспертов</li>
      <li>3 идеи сторис на сегодня</li>
      <li>контент план на неделю</li>
    </ol>
  </main>
</body>
</html>
